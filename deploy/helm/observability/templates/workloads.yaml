              value: {{ .Values.langfuse.minio.rootUser | quote }}
            - name: LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY
              value: {{ .Values.langfuse.minio.rootPassword | quote }}
            - name: LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE
              value: "true"
            - name: LANGFUSE_INIT_ORG_ID
              value: {{ .Values.langfuse.app.initOrgId | quote }}
            - name: LANGFUSE_INIT_ORG_NAME
              value: {{ .Values.langfuse.app.initOrgName | quote }}
            - name: LANGFUSE_INIT_PROJECT_ID
              value: {{ .Values.langfuse.app.initProjectId | quote }}
            - name: LANGFUSE_INIT_PROJECT_NAME
              value: {{ .Values.langfuse.app.initProjectName | quote }}
            {{- if .Values.langfuse.secretRefs.publicKeySecret }}
            - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.secretRefs.publicKeySecret | quote }}
                  key: {{ .Values.langfuse.secretRefs.publicKeySecretKey | quote }}
            {{- else }}
            - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
              value: {{ .Values.langfuse.app.initProjectPublicKey | quote }}
            {{- end }}
            {{- if .Values.langfuse.secretRefs.secretKeySecret }}
            - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.secretRefs.secretKeySecret | quote }}
                  key: {{ .Values.langfuse.secretRefs.secretKeySecretKey | quote }}
            {{- else }}
            - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
              value: {{ .Values.langfuse.app.initProjectSecretKey | quote }}
            {{- end }}
            - name: LANGFUSE_INIT_USER_EMAIL
              value: {{ .Values.langfuse.app.initUserEmail | quote }}
            - name: LANGFUSE_INIT_USER_NAME
              value: {{ .Values.langfuse.app.initUserName | quote }}
            - name: LANGFUSE_INIT_USER_PASSWORD
              value: {{ .Values.langfuse.app.initUserPassword | quote }}
{{- end }}
